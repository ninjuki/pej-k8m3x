<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permis de conduire – C'PERMIS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    padding: 24px 16px 40px;
    color: #1a2740;
  }

  header {
    background: linear-gradient(135deg, #1565C0, #1e88e5);
    border-radius: 16px;
    padding: 24px 20px;
    margin-bottom: 24px;
    color: white;
  }

  header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.3px; }
  header p { margin-top: 4px; font-size: 0.9rem; opacity: 0.85; }

  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    margin-top: 10px;
    letter-spacing: 0.3px;
  }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    opacity: 0.8;
    margin-top: 8px;
  }

  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #aed581;
    flex-shrink: 0;
  }
  .sync-dot.loading { background: #fff176; animation: pulse 1s infinite; }
  .sync-dot.error { background: #ef9a9a; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .section { margin-bottom: 20px; }

  .section-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #1565C0;
    margin-bottom: 10px;
    padding-left: 4px;
  }

  .card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid #f0f4f8;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .item:last-child { border-bottom: none; }
  .item:active { background: #f0f4f8; }

  .item.done .label { color: #90a4ae; text-decoration: line-through; }
  .item.done .checkbox { background: #1e88e5; border-color: #1e88e5; }
  .item.done .checkbox::after {
    content: '';
    display: block;
    width: 6px; height: 10px;
    border: 2px solid white;
    border-top: none; border-left: none;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .checkbox {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid #b0bec5;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .label { font-size: 0.92rem; font-weight: 500; line-height: 1.35; }
  .sublabel { font-size: 0.78rem; color: #78909c; margin-top: 2px; font-weight: 400; }

  .info-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 0.88rem;
    border-bottom: 1px solid #f0f4f8;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: #78909c; }
  .info-value { font-weight: 600; color: #1a2740; }
  .info-value.blue { color: #1565C0; }

  .price-banner {
    background: linear-gradient(135deg, #1b5e20, #2e7d32);
    border-radius: 12px;
    padding: 16px 20px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .price-banner .plabel { font-size: 0.85rem; opacity: 0.85; }
  .price-banner .amount { font-size: 1.8rem; font-weight: 800; }
  .price-banner .detail { font-size: 0.72rem; opacity: 0.75; margin-top: 2px; }

  .progress-bar {
    background: #e3f2fd;
    border-radius: 8px;
    height: 8px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #1e88e5;
    border-radius: 8px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 0.75rem;
    color: #78909c;
    margin-top: 6px;
    text-align: right;
  }
</style>
</head>
<body>

<header>
  <h1>🚗 Permis de conduire</h1>
  <p>Auto-école C'PERMIS — Cormeilles-en-Parisis</p>
  <span class="badge">AAC · Boîte manuelle · 1 500 €</span>
  <div class="sync-status">
    <div class="sync-dot loading" id="sync-dot"></div>
    <span id="sync-label">Connexion…</span>
  </div>
</header>

<script>
  const FIREBASE_URL = 'https://pej-k8m3x-default-rtdb.europe-west1.firebasedatabase.app/checklist.json';
  let state = {};
  let saving = false;

  function setSyncStatus(status) {
    const dot = document.getElementById('sync-dot');
    const label = document.getElementById('sync-label');
    dot.className = 'sync-dot';
    if (status === 'ok') { label.textContent = 'Synchronisé'; }
    else if (status === 'saving') { dot.classList.add('loading'); label.textContent = 'Enregistrement…'; }
    else if (status === 'loading') { dot.classList.add('loading'); label.textContent = 'Chargement…'; }
    else if (status === 'error') { dot.classList.add('error'); label.textContent = 'Erreur de sync'; }
  }

  async function loadFromFirebase() {
    setSyncStatus('loading');
    try {
      const res = await fetch(FIREBASE_URL);
      const data = await res.json();
      if (data) {
        state = data;
        applyState();
      }
      setSyncStatus('ok');
    } catch(e) {
      setSyncStatus('error');
    }
  }

  async function saveToFirebase() {
    if (saving) return;
    saving = true;
    setSyncStatus('saving');
    try {
      await fetch(FIREBASE_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state)
      });
      setSyncStatus('ok');
    } catch(e) {
      setSyncStatus('error');
    }
    saving = false;
  }

  function applyState() {
    document.querySelectorAll('.item[data-key]').forEach(el => {
      const key = el.dataset.key;
      if (state[key]) el.classList.add('done');
      else el.classList.remove('done');
    });
    updateProgress();
  }

  function toggle(el) {
    const key = el.dataset.key;
    if (!key) return;
    el.classList.toggle('done');
    state[key] = el.classList.contains('done');
    updateProgress();
    saveToFirebase();
  }

  function updateProgress() {
    const all = document.querySelectorAll('.section:first-of-type .item');
    const done = document.querySelectorAll('.section:first-of-type .item.done');
    const pct = Math.round((done.length / all.length) * 100);
    document.getElementById('prog').style.width = pct + '%';
    document.getElementById('prog-label').textContent = done.length + ' / ' + all.length + ' documents prêts';
  }

  loadFromFirebase();
</script>

<div style="background:#e8f5e9;border:1.5px solid #66bb6a;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;">
  <span style="font-size:1.3rem">&#127881;</span>
  <div>
    <div style="font-size:0.82rem;font-weight:700;color:#2e7d32;">Offre sp&#233;ciale rentr&#233;e septembre</div>
    <div style="font-size:0.78rem;color:#1b5e20;margin-top:2px;">-150&#8364; sur le forfait AAC &middot; valable du <strong>1er au 30 septembre</strong><br>Code en ligne offert pour toute inscription pendant la p&#233;riode</div>
  </div>
</div>

</body>
</html>
